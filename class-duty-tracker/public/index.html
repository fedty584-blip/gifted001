<head>

<style>
:root{--navy:#163b72;--blue:#2766c5;--sky:#eaf2ff;--ink:#182538;--muted:#68758a;--line:#e2e8f0;--bg:#f5f7fb;--green:#14804a;--red:#c43c48;--amber:#9a6700;--white:#fff;--shadow:0 12px 32px rgba(23,48,86,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#eaf0f8;color:#23405f}button.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red);border:1px solid #ffd6d6}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{border:1px solid #cfd8e5;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);width:100%;min-width:0}label{font-size:13px;color:var(--muted);display:block;margin-bottom:5px}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:white;padding:24px 15px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:12px;align-items:center;padding:0 9px}.brandicon{width:43px;height:43px;border-radius:14px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:23px}.brand strong{display:block;font-size:17px}.brand small{opacity:.7}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#d8e5f8;text-align:left;display:flex;align-items:center;gap:11px;font-weight:550}.nav button.active,.nav button:hover{background:#ffffff1c;color:#fff}.sidefoot{margin-top:auto;color:#b7c9e3;font-size:12px;line-height:1.6;padding:10px}.main{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:15px}.topbar h1{font-size:20px;margin:0}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:35px;height:35px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-weight:800}.content{padding:27px;max-width:1500px;margin:auto}.muted{color:var(--muted)}.small{font-size:12px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}.page-head h2{margin:0 0 5px;font-size:23px}.page-head p{margin:0;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stathead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.staticon{background:var(--sky);color:var(--blue);border-radius:10px;width:37px;height:37px;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:29px;margin-top:10px;letter-spacing:-.5px}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}.panel h3{font-size:16px;margin:0 0 16px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}.panelhead h3{margin:0}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters>div{min-width:140px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #edf0f5;font-size:13px;vertical-align:middle}th{background:#f8faff;color:#617089;font-weight:700;white-space:nowrap}tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.pill.done{background:#e6f7ee;color:var(--green)}.pill.not_done{background:#fff0f0;color:var(--red)}.pill.excused{background:#fff5d9;color:var(--amber)}.pill.pending{background:#edf1f6;color:#637083}.row-actions{display:flex;gap:7px}.empty{text-align:center;color:var(--muted);padding:30px}.barlist{display:grid;gap:15px}.barrow{display:grid;grid-template-columns:minmax(90px,1fr) 2fr 45px;gap:10px;align-items:center;font-size:13px}.bartrack{height:9px;border-radius:99px;background:#edf1f7;overflow:hidden}.barfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#377ce0,#58b6d5)}.donutarea{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--green) 0deg 0deg,#e5eaf2 0deg)}.donut:after{content:"";position:absolute;inset:18px;background:white;border-radius:50%}.donutlabel{z-index:1;text-align:center}.donutlabel strong{font-size:25px;display:block}.legend{display:grid;gap:10px;font-size:13px}.legend span{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{min-width:0}.formactions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.checkbox{width:19px;height:19px;accent-color:var(--green);cursor:pointer}.statusselect{min-width:145px}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:11px;background:#eff6ff;color:#214b85;font-size:13px;line-height:1.5;margin-bottom:16px}.error{background:#fff0f0;color:#9c252f}.success{background:#e8f8ee;color:#146b3d}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#d9e8ff,transparent 35%),linear-gradient(135deg,#f8fbff,#edf3fb)}.login-card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:30px;width:min(100%,460px)}.login-card h1{margin:15px 0 5px;font-size:24px}.login-card p{color:var(--muted);font-size:14px;line-height:1.6}.login-card .field{margin:13px 0}.login-card button{width:100%;margin-top:7px}.loginbrand{display:flex;align-items:center;gap:12px}.loginbrand .brandicon{background:var(--navy);color:white}.login-card .setupnote{font-size:12px;background:#fff7e5;color:#815b00;border-radius:10px;padding:12px}.mobile-menu{display:none}.month-controls{display:flex;align-items:center;gap:8px}.month-controls input{width:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calhead{text-align:center;font-size:11px;color:var(--muted);padding:7px 0}.calday{min-height:69px;border:1px solid var(--line);border-radius:9px;background:white;padding:7px;font-size:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:5px}.calday.blank{background:transparent;border-color:transparent;cursor:default}.calday.selected{border:2px solid var(--blue);padding:6px;background:#f0f6ff}.calday.hasrecord{background:#edf8f1}.calday.weekend{background:#f5f6f8;color:#7e8795}.calday.holiday{background:#fff5e9}.calday small{font-size:10px;color:var(--muted)}.daymark{width:6px;height:6px;border-radius:50%;background:var(--green)}.toast{position:fixed;bottom:20px;right:20px;background:#172b46;color:white;border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);z-index:20;max-width:min(90vw,400px)}.footerhint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}.chartbars{height:190px;display:flex;align-items:end;gap:10px;border-bottom:1px solid var(--line);padding:8px 4px 0}.chartcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:6px;min-width:0}.chartbar{width:min(100%,32px);min-height:2px;background:#3d83df;border-radius:6px 6px 0 0}.chartcol small{font-size:10px;color:var(--muted);white-space:nowrap}.chartcol b{font-size:10px}.print-only{display:none}
@media(max-width:1000px){.layout{grid-template-columns:210px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.content{padding:20px}.topbar{padding:0 20px}}
@media(max-width:700px){.layout{display:block}.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;width:260px;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{height:66px;padding:0 14px}.topbar h1{font-size:17px}.top-actions .admin-name{display:none}.content{padding:16px}.cards{gap:9px}.stat{padding:13px;border-radius:13px}.stat strong{font-size:24px}.stathead{font-size:12px}.staticon{width:31px;height:31px}.panel{padding:14px}.page-head h2{font-size:20px}.formgrid{grid-template-columns:1fr}.calday{min-height:52px;padding:4px;font-size:11px}.calday small{font-size:9px}.donutarea{justify-content:center}.filters>div{min-width:calc(50% - 8px);flex:1}.top-actions button{padding:8px 10px}}
@media print{body{background:white}.sidebar,.topbar,.no-print,.toast{display:none!important}.layout{display:block}.content{padding:0;max-width:none}.panel,.stat{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.print-only{display:block}.cards{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}table{min-width:0}th,td{font-size:10px;padding:7px}.panel{padding:12px}.page-head h2{font-size:20px}}
</style></head>
<body><div id="app"><div class="login-wrap"><div class="login-card"><div class="loginbrand"><div class="brandicon">✓</div><div><b>ระบบเช็กชื่อทำเวร</b><div class="muted small">กำลังโหลดระบบ...</div></div></div></div></div></div>
<script>
const $ = s => document.querySelector(s); const $$ = s => [...document.querySelectorAll(s)];
const state={admin:null,page:'dashboard',date:new Date().toLocaleDateString('en-CA'),month:new Date().toLocaleDateString('en-CA').slice(0,7),day:null,students:[],summary:null,holidays:[],settings:{class_label:'ห้องเรียนของฉัน'},audit:[],editing:null};
const icons={dashboard:'▦',check:'☑',students:'♙',calendar:'▦',reports:'▤',audit:'◷',settings:'⚙'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function thDate(d){return new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
function thMonth(m){return new Date(m+'-01T00:00:00').toLocaleDateString('th-TH',{month:'long',year:'numeric'});}
function today(){return new Date().toLocaleDateString('en-CA');}
async function api(path,opts={}){const res=await fetch('/api'+path,{credentials:'same-origin',...opts,headers:{'content-type':'application/json',...(opts.headers||{})}});if(!res.ok){let e={};try{e=await res.json()}catch{}throw new Error(e.error||'คำขอไม่สำเร็จ ('+res.status+')');}if((res.headers.get('content-type')||'').includes('application/json'))return res.json();return res;}
function toast(msg,kind=''){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.append(el)}el.className='toast '+kind;el.textContent=msg;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.remove(),3500)}
async function init(){try{const s=await api('/setup-status');if(s.setupRequired){renderSetup();return;}const me=await api('/me');state.admin=me.admin;await loadSettings();if(state.admin){await loadData();renderApp()}else renderLogin();}catch(e){renderFatal(e.message)}}
function renderFatal(msg){$('#app').innerHTML=`<div class="login-wrap"><div class="login-card"><div class="brandicon">!</div><h1>เชื่อมต่อระบบไม่ได้</h1><p>${esc(msg)}</p><p>ตรวจสอบว่าได้ติดตั้งฐานข้อมูล D1 และตั้งค่า Cloudflare Worker แล้ว</p><button onclick="location.reload()">ลองใหม่</button></div></div>`}
function renderSetup(){ $('#app').innerHTML=`<div class="login-wrap"><form class="login-card" id="setupForm"><div class="loginbrand"><div class="brandicon">✓</div><div><b>เริ่มต้นใช้งานครั้งแรก</b><div class="muted small">สร้างบัญชีแอดมินหลัก</div></div></div><h1>ตั้งค่าระบบ</h1><p>ขั้นตอนนี้ใช้ได้ครั้งเดียว เมื่อสร้างแอดมินแล้วระบบจะปิดการตั้งค่าเริ่มต้นโดยอัตโนมัติ</p><div class="field"><label>รหัสติดตั้ง (Bootstrap Secret)</label><input name="bootstrapSecret" type="password" required autocomplete="off"></div><div class="field"><label>ชื่อแสดงผลแอดมิน</label><input name="displayName" required minlength="2" placeholder="เช่น ผู้ดูแลระบบ"></div><div class="field"><label>ชื่อผู้ใช้ (4–40 ตัว)</label><input name="username" required minlength="4" maxlength="40" pattern="[a-zA-Z0-9_.-]+" autocomplete="username"></div><div class="field"><label>รหัสผ่าน (อย่างน้อย 12 ตัวอักษร)</label><input name="password" type="password" required minlength="12" autocomplete="new-password"></div><div id="formMsg"></div><button type="submit">สร้างบัญชีแอดมิน</button><p class="small">อย่าเปิดเผยรหัสติดตั้งหรือรหัสผ่านให้บุคคลอื่น</p></form></div>`;$('#setupForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const msg=$('#formMsg');try{await api('/setup',{method:'POST',body:JSON.stringify(d)});msg.className='notice success';msg.textContent='สร้างบัญชีแล้ว กำลังไปหน้าเข้าสู่ระบบ...';setTimeout(renderLogin,900)}catch(err){msg.className='notice error';msg.textContent=err.message}};}
function renderLogin(){ $('#app').innerHTML=`<div class="login-wrap"><form class="login-card" id="loginForm"><div class="loginbrand"><div class="brandicon">✓</div><div><b>ระบบเช็กชื่อทำเวร</b><div class="muted small">Class Duty Tracker</div></div></div><h1>ยินดีต้อนรับ</h1><p>เข้าสู่ระบบแอดมินเพื่อบันทึกและจัดการข้อมูลทำเวร บุคคลทั่วไปสามารถดูข้อมูลได้โดยไม่ต้องเข้าสู่ระบบ</p><div class="field"><label>ชื่อผู้ใช้</label><input name="username" required autocomplete="username"></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" required autocomplete="current-password"></div><div id="formMsg"></div><button type="submit">เข้าสู่ระบบ</button><p class="small">การเข้าถึงข้อมูลจะถูกจำกัดตามสิทธิ์บัญชีผู้ใช้</p></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.currentTarget));const r=await api('/login',{method:'POST',body:JSON.stringify(d)});state.admin=r.admin;await loadData();renderApp();toast('เข้าสู่ระบบสำเร็จ')}catch(err){$('#formMsg').className='notice error';$('#formMsg').textContent=err.message}};}
async function loadSettings(){try{const r=await api('/settings');state.settings=r.settings||state.settings}catch{}}
async function loadData(){const [st,su,hol]=await Promise.all([api('/students'),api('/summary?month='+state.month),api('/holidays?start='+state.month+'-01&end='+state.month+'-31')]);state.students=st.students;state.summary=su;state.holidays=hol.days;try{state.day=await api('/day?date='+state.date)}catch{state.day=null}}
function renderApp(){ $('#app').innerHTML=`<div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandicon">✓</div><div><strong>Duty Tracker</strong><small>ระบบเช็กชื่อทำเวร</small></div></div><nav class="nav">${[['dashboard','Dashboard','▦'],['check','เช็กชื่อทำเวร','☑'],['students','จัดการนักเรียน','♙'],['calendar','ปฏิทินวันเรียน','▦'],['reports','รายงานและสถิติ','▤'],['audit','ประวัติการแก้ไข','◷'],['settings','ตั้งค่าและบัญชีแอดมิน','⚙']].map(([id,label,ic])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span>${ic}</span>${label}</button>`).join('')}</nav><div class="sidefoot">ข้อมูลบันทึกใน Cloudflare D1<br>แสดงข้อมูลย้อนหลังได้ทุกเมื่อ</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu secondary" id="menuBtn">☰</button><h1 id="topTitle">Dashboard</h1></div><div class="top-actions"><span class="admin-name muted small">${state.admin?esc(state.admin.displayName):'โหมดดูข้อมูล'}</span><div class="avatar">${state.admin?'A':'ดู'}</div>${state.admin?'<button class="ghost" id="logoutBtn">ออกจากระบบ</button>':'<button id="loginBtn">แอดมินเข้าสู่ระบบ</button>'}</div></header><section class="content" id="pageContent"></section></main></div>`;
$$('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;$('#sidebar').classList.remove('open');renderApp();if(state.page==='audit')loadAudit();if(state.page==='settings')loadAdmins();});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');if(state.admin)$('#logoutBtn').onclick=logout;else $('#loginBtn').onclick=renderLogin;renderPage();}
function navTitle(){return ({dashboard:'Dashboard',check:'เช็กชื่อทำเวร',students:'จัดการนักเรียน',calendar:'ปฏิทินวันเรียน',reports:'รายงานและสถิติ',audit:'ประวัติการแก้ไข',settings:'ตั้งค่าห้องเรียน'})[state.page]||'Dashboard'}
function statCard(label,value,icon,sub=''){return `<div class="stat"><div class="stathead"><span>${label}</span><span class="staticon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function percent(s){return s.eligible?Math.round(s.done/s.eligible*1000)/10:0}
function renderPage(){const c=$('#pageContent');$('#topTitle').textContent=navTitle();if(state.page==='dashboard')c.innerHTML=dashboardHTML();else if(state.page==='check')c.innerHTML=checkHTML();else if(state.page==='students')c.innerHTML=studentsHTML();else if(state.page==='calendar')c.innerHTML=calendarHTML();else if(state.page==='reports')c.innerHTML=reportsHTML();else if(state.page==='audit')c.innerHTML=auditHTML();else c.innerHTML=settingsHTML();wirePage();if(state.page==='settings')loadAdmins();}
function dashboardHTML(){const s=state.summary||{counts:{},students:[],days:[],schoolDays:0,holidays:0};const c=s.counts||{};const pct=(c.done+c.not_done)?Math.round(c.done/(c.done+c.not_done)*100):0;const top=(s.students||[]).slice(0,5);const week=['อา','จ','อ','พ','พฤ','ศ','ส'];const d0=new Date(state.month+'-01T00:00:00'),offset=d0.getDay(),n=new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5,7)),0).getDate();const rec=new Set((s.days||[]).map(d=>d.day_date));const holidayMap=new Map((s.holidayOverrides||[]).map(d=>[d.day_date,d]));let cells=week.map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<offset;i++)cells+='<div class="calday blank"></div>';for(let d=1;d<=n;d++){const date=state.month+'-'+String(d).padStart(2,'0'),dt=new Date(date+'T00:00:00'),weekend=dt.getDay()===0||dt.getDay()===6,ov=holidayMap.get(date);cells+=`<button class="calday ${state.date===date?'selected':''} ${rec.has(date)?'hasrecord':''} ${weekend?'weekend':''} ${ov?.kind==='holiday'?'holiday':''}" data-date="${date}"><b>${d}</b>${rec.has(date)?'<span class="daymark"></span>':''}<small>${rec.has(date)?'บันทึกแล้ว':ov?.title||((weekend)?'วันหยุด':'')}</small></button>`;}return `<div class="page-head"><div><h2>ภาพรวมการทำเวร</h2><p>${esc(state.settings.class_label||'ห้องเรียนของฉัน')} · ${thMonth(state.month)}</p></div><div class="filters"><div><label>เลือกเดือน</label><input type="month" id="dashMonth" value="${state.month}"></div><button data-goto="check">+ เช็กชื่อวันนี้</button></div></div><div class="cards">${statCard('วันเรียนตามปฏิทิน',s.schoolDays||0,'▦','รวมวันเรียนชดเชยที่กำหนด')}${statCard('วันหยุด',s.holidays||0,'☼','รวมเสาร์–อาทิตย์และวันหยุดที่ตั้งค่า')}${statCard('บันทึกทำเวรแล้ว',c.records||0,'✓','วันในเดือนที่มีข้อมูล')}${statCard('เปอร์เซ็นต์ทำเวร',pct+'%','↗','เทียบรายการที่มีหน้าที่ทำเวร')}</div><div class="grid2"><div class="panel"><div class="panelhead"><h3>ปฏิทินประจำเดือน</h3><span class="muted small">คลิกวันที่เพื่อดูหรือบันทึก</span></div><div class="calendar">${cells}</div><div class="footerhint">สีเขียว = มีบันทึก · สีเทา = เสาร์–อาทิตย์ · สีส้ม = วันหยุดที่กำหนด</div></div><div class="panel"><div class="panelhead"><h3>สัดส่วนการทำเวร</h3><span class="muted small">${thMonth(state.month)}</span></div><div class="donutarea"><div class="donut" style="background:conic-gradient(#14804a 0deg ${pct*3.6}deg,#c43c48 ${pct*3.6}deg 360deg)"><div class="donutlabel"><strong>${pct}%</strong><span class="small muted">ทำเวรแล้ว</span></div></div><div class="legend"><span><i class="dot" style="background:#14804a"></i>ทำเวรแล้ว <b>${c.done||0}</b></span><span><i class="dot" style="background:#c43c48"></i>ไม่ทำเวร <b>${c.not_done||0}</b></span><span><i class="dot" style="background:#e4b13d"></i>ลา/ยกเว้น <b>${c.excused||0}</b></span></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>อันดับเปอร์เซ็นต์การทำเวร</h3><div class="barlist">${top.length?top.map((x,i)=>`<div class="barrow"><span>${i+1}. ${esc(x.full_name)}</span><div class="bartrack"><div class="barfill" style="width:${percent(x)}%"></div></div><b>${percent(x)}%</b></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูล</div>'}</div></div></div>`}
function checkHTML(){const d=state.day||{students:[],record:null,schoolDay:null};const editable=!!state.admin;return `<div class="page-head"><div><h2>เช็กชื่อทำเวรประจำวัน</h2><p>เลือกวันที่ แล้วบันทึกผลการทำเวรของนักเรียน</p></div><div class="filters"><div><label>วันที่</label><input type="date" id="checkDate" value="${state.date}"></div><button class="secondary" id="todayBtn">วันนี้</button></div></div>${d.schoolDay?`<div class="notice">${d.schoolDay.kind==='holiday'?'วันหยุด: ':'วันเรียนพิเศษ: '}${esc(d.schoolDay.title)}</div>`:''}${!editable?'<div class="notice">โหมดดูข้อมูล: ต้องเข้าสู่ระบบแอดมินเพื่อบันทึกหรือแก้ไข</div>':''}<div class="panel"><div class="panelhead"><div><h3>รายชื่อนักเรียน</h3><span class="muted small">${thDate(state.date)} · ${d.record?'บันทึกแล้ว':'ยังไม่มีการบันทึก'}</span></div><div class="row-actions">${editable?'<button class="secondary" id="markAll">ติ๊กทุกคนว่าทำแล้ว</button><button id="saveDay">บันทึกผล</button>':''}</div></div><div class="tablewrap"><table><thead><tr><th>เลขที่</th><th>ชื่อ–สกุล</th><th>ชั้นเรียน</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead><tbody>${d.students?.length?d.students.map(s=>`<tr data-student="${s.id}"><td>${esc(s.roll_number)}</td><td><b>${esc(s.full_name)}</b></td><td>${esc(s.class_name)}</td><td>${editable?`<label style="display:flex;align-items:center;gap:7px;color:var(--ink);font-size:13px;margin:0"><input type="checkbox" class="checkbox entry-done" ${s.status==='done'?'checked':''}> ทำแล้ว</label><select class="entry-excused" style="margin-top:6px;max-width:160px"><option value="">สถานะปกติ</option><option value="excused" ${s.status==='excused'?'selected':''}>ลา/ได้รับยกเว้น</option></select>`:`<span class="pill ${s.status||'pending'}">${s.status==='done'?'ทำเวรแล้ว':s.status==='not_done'?'ไม่ทำเวร':s.status==='excused'?'ลา/ได้รับยกเว้น':'ยังไม่มีข้อมูล'}</span>`}</td><td>${editable?`<input class="entry-note" value="${esc(s.note||'')}" placeholder="หมายเหตุ (ถ้ามี)">`:esc(s.note||'-')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">ยังไม่มีรายชื่อนักเรียน เพิ่มรายชื่อในเมนูจัดการนักเรียนก่อน</td></tr>'}</tbody></table></div><div class="footerhint">เมื่อบันทึกแล้ว นักเรียนที่ไม่ได้เลือก “ทำเวรแล้ว” จะมีสถานะตามตัวเลือกที่กำหนด · วันที่ไม่มีบันทึกจะไม่ถูกนับเป็นวันที่ไม่ทำเวร</div></div>`}
function studentsHTML(){return `<div class="page-head"><div><h2>จัดการนักเรียน</h2><p>เพิ่ม แก้ไข หรือปิดใช้งานรายชื่อ โดยเก็บประวัติย้อนหลังไว้</p></div>${state.admin?'<button id="addStudent">+ เพิ่มนักเรียน</button>':''}</div>${state.admin?`<div class="panel hidden" id="studentFormPanel"><h3 id="studentFormTitle">เพิ่มนักเรียน</h3><form id="studentForm"><div class="formgrid"><div class="field"><label>เลขที่</label><input name="rollNumber" required></div><div class="field"><label>ชื่อ–สกุล</label><input name="fullName" required></div><div class="field"><label>ชั้นเรียน</label><input name="className" required placeholder="เช่น ม.3/11"></div></div><div class="formactions"><button type="button" class="secondary" id="cancelStudent">ยกเลิก</button><button type="submit">บันทึกข้อมูล</button></div></form></div>`:''}<div class="panel"><div class="panelhead"><h3>รายชื่อนักเรียนทั้งหมด (${state.students.length})</h3><input id="studentSearch" placeholder="ค้นหาชื่อหรือเลขที่" style="max-width:260px"></div><div class="tablewrap"><table><thead><tr><th>เลขที่</th><th>ชื่อ–สกุล</th><th>ชั้นเรียน</th><th>สถานะ</th>${state.admin?'<th>จัดการ</th>':''}</tr></thead><tbody id="studentRows">${studentRows(state.students)}</tbody></table></div></div>`}
function studentRows(list){return list.length?list.map(s=>`<tr><td>${esc(s.roll_number)}</td><td><b>${esc(s.full_name)}</b></td><td>${esc(s.class_name)}</td><td><span class="pill ${s.active?'done':'pending'}">${s.active?'ใช้งาน':'ปิดใช้งาน'}</span></td>${state.admin?`<td><div class="row-actions"><button class="secondary" data-edit-student="${s.id}">แก้ไข</button>${s.active?`<button class="danger" data-disable-student="${s.id}">ปิดใช้งาน</button>`:''}</div></td>`:''}</tr>`).join(''):'<tr><td colspan="5" class="empty">ไม่พบรายชื่อนักเรียน</td></tr>'}
function calendarHTML(){const y=Number(state.month.slice(0,4)),m=Number(state.month.slice(5,7)),first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),records=new Set((state.summary?.days||[]).map(d=>d.day_date)),overrides=new Map((state.summary?.holidayOverrides||[]).map(d=>[d.day_date,d]));let cells=['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div class="calday blank"></div>';for(let d=1;d<=n;d++){let date=`${state.month}-${String(d).padStart(2,'0')}`,weekend=[0,6].includes(new Date(date+'T00:00:00').getDay()),ov=overrides.get(date);cells+=`<button class="calday ${state.date===date?'selected':''} ${records.has(date)?'hasrecord':''} ${weekend?'weekend':''} ${ov?.kind==='holiday'?'holiday':''}" data-date="${date}"><b>${d}</b>${records.has(date)?'<span class="daymark"></span>':''}<small>${ov?.title||(records.has(date)?'บันทึกแล้ว':weekend?'วันหยุด':'')}</small></button>`;}return `<div class="page-head"><div><h2>ปฏิทินวันเรียนและวันหยุด</h2><p>เลือกวันเพื่อเปิดผลการทำเวรย้อนหลัง</p></div><div class="month-controls"><button class="secondary" id="prevMonth">‹</button><input type="month" id="calMonth" value="${state.month}"><button class="secondary" id="nextMonth">›</button></div></div><div class="grid2"><div class="panel"><div class="calendar">${cells}</div><div class="footerhint">เสาร์–อาทิตย์จะเป็นวันหยุดโดยอัตโนมัติ สามารถกำหนดวันหยุดหรือวันเรียนชดเชยในแผงด้านข้างได้</div></div><div class="panel"><h3>กำหนดวันพิเศษ</h3>${state.admin?`<form id="holidayForm"><div class="field"><label>วันที่</label><input type="date" name="date" required value="${state.date}"></div><div class="field" style="margin-top:10px"><label>ประเภทวัน</label><select name="kind"><option value="holiday">วันหยุด</option><option value="school_day">วันเรียนชดเชย / วันเรียนพิเศษ</option></select></div><div class="field" style="margin-top:10px"><label>ชื่อวัน / หมายเหตุ</label><input name="title" required placeholder="เช่น วันหยุดโรงเรียน"></div><button style="margin-top:13px;width:100%">บันทึกวันพิเศษ</button></form>`:'<div class="notice">เข้าสู่ระบบแอดมินเพื่อเพิ่มหรือแก้ไขวันพิเศษ</div>'}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>วันพิเศษในเดือนนี้</h3>${state.holidays.length?state.holidays.map(h=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px"><span><b>${thDate(h.day_date)}</b><br><span class="muted">${esc(h.title)}</span></span>${state.admin?`<button class="danger" data-delete-holiday="${h.day_date}">ลบ</button>`:''}</div>`).join(''):'<div class="empty">ยังไม่มีวันพิเศษที่กำหนด</div>'}</div></div>`}
function reportsHTML(){const s=state.summary||{students:[],counts:{}};const c=s.counts||{};return `<div class="page-head"><div><h2>รายงานและสถิติ</h2><p>สรุปผลรายเดือน เรียงอันดับตามเปอร์เซ็นต์การทำเวร</p></div><div class="filters"><div><label>เดือนที่ต้องการ</label><input type="month" id="reportMonth" value="${state.month}"></div><button class="secondary" id="exportCsv">ดาวน์โหลด CSV</button>${state.admin?'<button class="secondary" id="backupBtn">สำรองข้อมูล JSON</button>':''}<button id="pdfBtn">พิมพ์ / บันทึก PDF</button></div></div><div id="printReport"><div class="print-only"><h2>รายงานสรุปการทำเวรประจำเดือน ${thMonth(state.month)}</h2><p>${esc(state.settings.class_label||'ห้องเรียนของฉัน')}</p></div><div class="cards">${statCard('ทำเวรแล้ว',c.done||0,'✓','รายการทั้งหมด')}${statCard('ไม่ทำเวร',c.not_done||0,'×','เฉพาะวันที่มีบันทึก')}${statCard('ลา/ได้รับยกเว้น',c.excused||0,'◷','ไม่คิดเป็นไม่ทำเวร')}${statCard('วันมีบันทึก',c.records||0,'▦','วันในเดือนนี้')}</div><div class="grid2"><div class="panel"><h3>อันดับรายบุคคล</h3><div class="tablewrap"><table><thead><tr><th>อันดับ</th><th>เลขที่</th><th>ชื่อ–สกุล</th><th>ทำแล้ว</th><th>ไม่ทำ</th><th>ยกเว้น</th><th>%</th></tr></thead><tbody>${s.students?.length?s.students.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.roll_number)}</td><td>${esc(x.full_name)}</td><td>${x.done||0}</td><td>${x.not_done||0}</td><td>${x.excused||0}</td><td><b>${percent(x)}%</b></td></tr>`).join(''):'<tr><td colspan="7" class="empty">ยังไม่มีข้อมูลในเดือนนี้</td></tr>'}</tbody></table></div></div><div class="panel"><h3>สัดส่วนสถานะทำเวร</h3><div class="donutarea"><div class="donut" style="background:conic-gradient(#14804a 0deg ${(c.done||0)/Math.max(1,(c.done||0)+(c.not_done||0)+(c.excused||0))*360}deg,#c43c48 ${(c.done||0)/Math.max(1,(c.done||0)+(c.not_done||0)+(c.excused||0))*360}deg ${(c.done||0)+(c.not_done||0)?(c.done+c.not_done)/Math.max(1,c.done+c.not_done+c.excused)*360:0}deg,#e4b13d 0deg 360deg)"><div class="donutlabel"><strong>${Math.round((c.done||0)/Math.max(1,(c.done||0)+(c.not_done||0))*100)}%</strong><span class="small muted">ทำแล้ว</span></div></div><div class="legend"><span><i class="dot" style="background:#14804a"></i>ทำเวรแล้ว: ${c.done||0}</span><span><i class="dot" style="background:#c43c48"></i>ไม่ทำเวร: ${c.not_done||0}</span><span><i class="dot" style="background:#e4b13d"></i>ลา/ยกเว้น: ${c.excused||0}</span></div></div><p class="footerhint">เปอร์เซ็นต์รายบุคคล = จำนวนครั้งที่ทำเวร ÷ จำนวนวันที่มีหน้าที่ทำเวรจริง โดยไม่นับรายการลา/ยกเว้น</p></div></div><div class="panel" style="margin-top:16px"><h3>สถิติรายวันในเดือนนี้</h3><div class="chartbars">${Array.from({length:new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5,7)),0).getDate()},(_,i)=>{const day=String(i+1).padStart(2,'0'),date=state.month+'-'+day,record=(s.days||[]).find(d=>d.day_date===date),height=record?Math.max(8,Math.min(100,((c.done||0)+(c.not_done||0)+(c.excused||0))*2)):2;return `<div class="chartcol"><b>${record?'●':''}</b><div class="chartbar" style="height:${height}% ;opacity:${record?1:.15}"></div><small>${i+1}</small></div>`}).join('')}</div></div></div>`}
function auditHTML(){return `<div class="page-head"><div><h2>ประวัติการแก้ไข</h2><p>ตรวจสอบว่าใครเปลี่ยนแปลงข้อมูล เมื่อใด และเปลี่ยนอะไร</p></div><button id="refreshAudit" class="secondary">รีเฟรช</button></div><div class="panel">${!state.admin?'<div class="notice">เข้าสู่ระบบแอดมินเพื่อดูบันทึกการแก้ไข</div>':`<div class="tablewrap"><table><thead><tr><th>วันเวลา</th><th>ผู้แก้ไข</th><th>การกระทำ</th><th>ประเภทข้อมูล</th><th>รหัสข้อมูล</th><th>รายละเอียด</th></tr></thead><tbody>${state.audit.length?state.audit.map(l=>`<tr><td>${esc(l.created_at)}</td><td>${esc(l.display_name||l.username||'ระบบ')}</td><td>${esc(({create:'สร้าง',update:'แก้ไข',delete:'ลบ',deactivate:'ปิดใช้งาน',upsert:'เพิ่ม/แก้ไข'})[l.action]||l.action)}</td><td>${esc(l.entity_type)}</td><td>${esc(l.entity_id||'-')}</td><td><button class="secondary" data-audit-detail="${l.id}">ดูรายละเอียด</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีประวัติการแก้ไข</td></tr>'}</tbody></table></div>`}</div>`}
function settingsHTML(){return `<div class="page-head"><div><h2>ตั้งค่าห้องเรียนและบัญชีแอดมิน</h2><p>กำหนดชื่อที่แสดงบน Dashboard และจัดการบัญชีแอดมิน</p></div></div><div class="panel" style="max-width:650px"><form id="settingsForm"><div class="field"><label>ชื่อห้องเรียน / ชื่อกลุ่ม</label><input name="class_label" required value="${esc(state.settings.class_label||'ห้องเรียนของฉัน')}" ${state.admin?'':'disabled'}></div>${state.admin?'<div class="formactions"><button type="submit">บันทึกการตั้งค่า</button></div>':'<div class="notice">เข้าสู่ระบบแอดมินเพื่อแก้ไขการตั้งค่า</div>'}</form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>ข้อมูลระบบ</h3><p class="muted small">ระบบใช้ Cloudflare Workers ประมวลผล และ Cloudflare D1 เก็บข้อมูล ผู้ดูแลควรดาวน์โหลดไฟล์สำรองเป็นระยะและเก็บไว้ในที่ปลอดภัย</p>${state.admin?'<button class="secondary" id="backupBtn2">ดาวน์โหลดไฟล์สำรอง JSON</button>':''}</div>${state.admin?`<div class="panel" style="margin-top:16px"><div class="panelhead"><h3>บัญชีแอดมิน (สิทธิ์เท่ากันทุกบัญชี)</h3><button id="addAdminBtn">+ เพิ่มแอดมิน</button></div><div id="adminFormWrap" class="hidden"><form id="adminForm"><div class="formgrid"><div class="field"><label>ชื่อแสดงผล</label><input name="displayName" required></div><div class="field"><label>ชื่อผู้ใช้</label><input name="username" required minlength="4" pattern="[a-zA-Z0-9_.-]+"></div><div class="field"><label>รหัสผ่าน (อย่างน้อย 12 ตัว)</label><input name="password" type="password" required minlength="12"></div></div><div class="formactions"><button type="button" id="cancelAdmin" class="secondary">ยกเลิก</button><button type="submit">สร้างบัญชี</button></div></form></div><div id="adminRows" class="empty">กำลังโหลดบัญชี...</div><p class="footerhint">ปิดใช้งานบัญชีจะยุติเซสชันของบัญชีนั้นทันที ไม่สามารถปิดบัญชีที่กำลังเข้าสู่ระบบอยู่ได้</p></div>`:`<div class="panel" style="margin-top:16px"><h3>บัญชีแอดมิน</h3><div class="notice">เข้าสู่ระบบแอดมินเพื่อจัดการบัญชีผู้ใช้</div></div>`}`}
function wirePage(){if($('#dashMonth'))$('#dashMonth').onchange=e=>changeMonth(e.target.value);if($('#reportMonth'))$('#reportMonth').onchange=e=>changeMonth(e.target.value);if($('#calMonth'))$('#calMonth').onchange=e=>changeMonth(e.target.value);$$('[data-date]').forEach(b=>b.onclick=async()=>{state.date=b.dataset.date;state.page='check';await loadDay();renderApp()});$$('[data-goto]').forEach(b=>b.onclick=()=>{state.page=b.dataset.goto;state.date=today();loadDay().then(renderApp)});if($('#checkDate'))$('#checkDate').onchange=async e=>{state.date=e.target.value;await loadDay();renderPage()};if($('#todayBtn'))$('#todayBtn').onclick=async()=>{state.date=today();await loadDay();renderPage()};if($('#saveDay'))$('#saveDay').onclick=saveDay;if($('#markAll'))$('#markAll').onclick=()=>{$$('.entry-done').forEach(s=>s.checked=true);$('.entry-excused')&&$$('.entry-excused').forEach(s=>s.value='')};if($('#addStudent'))$('#addStudent').onclick=()=>{state.editing=null;$('#studentForm').reset();$('#studentFormTitle').textContent='เพิ่มนักเรียน';$('#studentFormPanel').classList.remove('hidden')};if($('#cancelStudent'))$('#cancelStudent').onclick=()=>$('#studentFormPanel').classList.add('hidden');if($('#studentForm'))$('#studentForm').onsubmit=saveStudent;if($('#studentSearch'))$('#studentSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('#studentRows').innerHTML=studentRows(state.students.filter(s=>(s.full_name+' '+s.roll_number+' '+s.class_name).toLowerCase().includes(q)));wireStudentButtons()};wireStudentButtons();if($('#holidayForm'))$('#holidayForm').onsubmit=saveHoliday;$$('[data-delete-holiday]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบวันพิเศษ '+b.dataset.deleteHoliday+' หรือไม่?'))return;try{await api('/holidays/'+b.dataset.deleteHoliday,{method:'DELETE'});await loadData();renderPage();toast('ลบวันพิเศษแล้ว')}catch(e){toast(e.message,'error')}});if($('#prevMonth'))$('#prevMonth').onclick=()=>changeMonth(shiftMonth(state.month,-1));if($('#nextMonth'))$('#nextMonth').onclick=()=>changeMonth(shiftMonth(state.month,1));if($('#exportCsv'))$('#exportCsv').onclick=()=>download('/api/export.csv?month='+state.month);if($('#backupBtn')||$('#backupBtn2')){if($('#backupBtn'))$('#backupBtn').onclick=()=>download('/api/backup.json');if($('#backupBtn2'))$('#backupBtn2').onclick=()=>download('/api/backup.json')}if($('#pdfBtn'))$('#pdfBtn').onclick=()=>window.print();if($('#settingsForm'))$('#settingsForm').onsubmit=saveSettings;if($('#addAdminBtn'))$('#addAdminBtn').onclick=()=>$('#adminFormWrap').classList.remove('hidden');if($('#cancelAdmin'))$('#cancelAdmin').onclick=()=>$('#adminFormWrap').classList.add('hidden');if($('#adminForm'))$('#adminForm').onsubmit=saveAdmin;if($('#refreshAudit'))$('#refreshAudit').onclick=loadAudit;$$('[data-audit-detail]').forEach(b=>b.onclick=()=>{const l=state.audit.find(x=>x.id==b.dataset.auditDetail);if(l)alert('ก่อนแก้ไข:\n'+(l.before_json||'-')+'\n\nหลังแก้ไข:\n'+(l.after_json||'-'))});}
function wireStudentButtons(){$$('[data-edit-student]').forEach(b=>b.onclick=()=>{const s=state.students.find(x=>x.id===Number(b.dataset.editStudent));if(!s)return;state.editing=s.id;const f=$('#studentForm');f.rollNumber.value=s.roll_number;f.fullName.value=s.full_name;f.className.value=s.class_name;$('#studentFormTitle').textContent='แก้ไขข้อมูลนักเรียน';$('#studentFormPanel').classList.remove('hidden')});$$('[data-disable-student]').forEach(b=>b.onclick=async()=>{if(!confirm('ปิดใช้งานรายชื่อนี้? ประวัติการทำเวรเดิมจะยังคงอยู่'))return;try{await api('/students/'+b.dataset.disableStudent,{method:'DELETE'});await loadData();renderPage();toast('ปิดใช้งานรายชื่อแล้ว')}catch(e){toast(e.message,'error')}})}
async function loadDay(){state.day=await api('/day?date='+state.date);}
async function saveDay(){try{const entries=$$('[data-student]').map(tr=>({studentId:Number(tr.dataset.student),status:tr.querySelector('.entry-excused').value==='excused'?'excused':(tr.querySelector('.entry-done').checked?'done':'not_done'),note:tr.querySelector('.entry-note').value}));await api('/day',{method:'PUT',body:JSON.stringify({date:state.date,entries,confirmed:true})});state.month=state.date.slice(0,7);await loadData();renderApp();toast('บันทึกผลการทำเวรเรียบร้อย','success')}catch(e){toast(e.message,'error')}}
async function saveStudent(e){e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));try{if(state.editing){await api('/students/'+state.editing,{method:'PATCH',body:JSON.stringify(d)})}else{await api('/students',{method:'POST',body:JSON.stringify(d)})}state.editing=null;await loadData();renderPage();toast('บันทึกข้อมูลนักเรียนแล้ว','success')}catch(err){toast(err.message,'error')}}
async function saveHoliday(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));try{await api('/holidays',{method:'POST',body:JSON.stringify(d)});await loadData();renderPage();toast('บันทึกวันพิเศษแล้ว','success')}catch(err){toast(err.message,'error')}}
async function loadAdmins(){if(!state.admin||!$('#adminRows'))return;try{const r=await api('/admins');$('#adminRows').innerHTML='<div class="tablewrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อแสดงผล</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>'+r.admins.map(a=>`<tr><td>${esc(a.username)}</td><td>${esc(a.display_name)}</td><td><span class="pill ${a.active?'done':'pending'}">${a.active?'ใช้งาน':'ปิดใช้งาน'}</span></td><td>${a.id!==state.admin.id&&a.active?`<button class="danger" data-disable-admin="${a.id}">ปิดใช้งาน</button>`:'-'}</td></tr>`).join('')+'</tbody></table></div>';$$('[data-disable-admin]').forEach(b=>b.onclick=async()=>{if(!confirm('ปิดใช้งานบัญชีแอดมินนี้หรือไม่?'))return;try{await api('/admins/'+b.dataset.disableAdmin,{method:'PATCH',body:JSON.stringify({active:false})});await loadAdmins();toast('ปิดใช้งานบัญชีแล้ว')}catch(e){toast(e.message,'error')}})}catch(e){$('#adminRows').textContent=e.message}}
async function saveAdmin(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));try{await api('/admins',{method:'POST',body:JSON.stringify(d)});e.currentTarget.reset();$('#adminFormWrap').classList.add('hidden');await loadAdmins();toast('เพิ่มบัญชีแอดมินแล้ว','success')}catch(err){toast(err.message,'error')}}
async function saveSettings(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));try{await api('/settings',{method:'PUT',body:JSON.stringify(d)});await loadSettings();renderApp();toast('บันทึกการตั้งค่าแล้ว','success')}catch(err){toast(err.message,'error')}}
async function changeMonth(m){if(!m)return;state.month=m;if(!state.date.startsWith(m))state.date=m+'-01';try{await loadData();if(state.page==='audit')await loadAudit();renderApp()}catch(e){toast(e.message,'error')}}function shiftMonth(m,n){const d=new Date(m+'-01T00:00:00');d.setMonth(d.getMonth()+n);return d.toLocaleDateString('en-CA').slice(0,7)}
async function loadAudit(){if(!state.admin)return;try{const r=await api('/audit');state.audit=r.logs;renderPage()}catch(e){toast(e.message,'error')}}
async function download(path){try{const r=await fetch(path,{credentials:'same-origin'});if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.error||'ดาวน์โหลดไม่สำเร็จ')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(r.headers.get('content-disposition')||'').match(/filename="?([^";]+)"?/)?.[1]||'download';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(a.href)}catch(e){toast(e.message,'error')}}
async function logout(){try{await api('/logout',{method:'POST',body:'{}'});state.admin=null;renderLogin()}catch(e){toast(e.message,'error')}}
// Public read-only mode: Dashboard and daily list remain accessible without a login.
init();
</script></body></html>
